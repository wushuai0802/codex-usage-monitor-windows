name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Test and build runtime package
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Create GitHub Release and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = Get-ChildItem .\dist\codex-usage-monitor-windows-*.zip -File | Select-Object -First 1
          if (-not $archive) { throw 'Runtime package was not created.' }
          $checksum = $archive.FullName + '.sha256'
          ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $archive.Name) | Set-Content -LiteralPath $checksum -Encoding ascii
          $releaseTags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName })
          if ($releaseTags -contains $tag) {
            gh release upload $tag $archive.FullName $checksum --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $archive.FullName $checksum --repo $env:GITHUB_REPOSITORY --title "Codex Usage Monitor Windows $tag" --generate-notes --verify-tag
          }
